services:


  db-postgresql:
    image: postgres:17.5-alpine
    container_name: signing-simulator-db-postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: signingSimulatorDB
    ports:
      - "5431:5432"
    volumes:
      - db-postgresql-vol:/var/lib/postgresql/data


  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: signing-simulator-kafka-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: signing-simulator-kafka-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: signing-simulator-kafka-zookeeper:2181
    ports:
      - 9092:9092
    depends_on:
      - zookeeper

volumes:
  db-postgresql-vol:
