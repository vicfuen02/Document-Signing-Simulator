services:


  db-postgresql:
    image: postgres:17.5-alpine
    container_name: signing-simulator-db-postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: signingSimulatorDB
    ports:
      - "5431:5432"
    volumes:
      - db-postgresql-vol:/var/lib/postgresql/data
    networks:
      - signing-simulator-network


  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.6
    container_name: signing-simulator-kafka-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181
    networks:
      - signing-simulator-network

  kafka1:
    image: confluentinc/cp-kafka:7.2.6
    container_name: signing-simulator-kafka-kafka1
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_ZOOKEEPER_CONNECT: signing-simulator-kafka-zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - 9092:9092
    depends_on:
      - zookeeper
    networks:
      - signing-simulator-network

volumes:
  db-postgresql-vol:

networks:
  signing-simulator-network:
    driver: bridge
